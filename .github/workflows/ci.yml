name: verify site

# This workflow does not replace scripts/check_site.py — that is the site's authority.
# It adds three things a single gate cannot do for itself: a second opinion written from the policy
# documents, a staleness queue over the registers, and proof that the committed HTML is what the
# generator produces (so the data files stay the only place to edit).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild from the registers
        run: python3 scripts/build_site.py

      - name: Site gate (disclosure, sponsored+tagged buy links, no prices, links, sitemap, data sanity)
        run: python3 scripts/check_site.py

      - name: Committed output must equal generator output
        run: |
          git diff --exit-code -- '*.html' '*.xml' 'assets/search-index.json' || {
            echo "::error::committed HTML is not what scripts/build_site.py produces — run npm run build and commit the result"; exit 1; }

      - name: Feed and sitemap must be well-formed XML
        run: |
          python3 - <<'PY'
          import xml.dom.minidom
          for f in ("feed.xml", "sitemap.xml"):
              xml.dom.minidom.parse(f); print("ok:", f)
          PY

      # Independent gate, written against the policy documents rather than this repo's checker.
      # Findings are published as AUDIT.md so a divergence cannot be lost in a log line. It is
      # non-blocking on purpose: red CI on someone else's in-flight content teaches people to ignore
      # CI. Flip AUDIT_STRICT=1 here once the open findings are closed, and it becomes a gate.
      - name: Independent audit (report)
        run: |
          if [ "${AUDIT_STRICT:-0}" = "1" ]; then node tools/audit.mjs --strict; else node tools/audit.mjs; fi
          sed -n '1,28p' AUDIT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: AUDIT.md
          if-no-files-found: warn

      - name: Staleness queue (informational — tells the owner who must act)
        continue-on-error: true
        run: node tools/freshness.mjs --days 30 || echo "::warning::product rows are past the 30-day re-check window; re-read or remove them"
