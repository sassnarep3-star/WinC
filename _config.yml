# GitHub Pages builds this repository with Jekyll in "legacy" mode from branch main, path /
# (observed via GET /repos/sassnarep3-star/WinC/pages on 2026-11-20 — recorded as SRC-10).
# The site itself is plain generated HTML, so the only thing we need from Jekyll is to *not*
# publish the scaffolding that produced it.
theme: null
title: "Crisp Report"
description: "Small-appliance buying intelligence: sourced claims, question-shaped guides, and a visible note whenever a link can earn a commission."
baseurl: "/WinC"

# Published on purpose: the registers are the audit trail, and every table cell on the site
# points into them. See FLG-010 — if that is not wanted, move data/ out of the source tree.
include:
  - data

exclude:
  - tools
  - content
  - node_modules
  - package.json
  - README.md
  - COORDINATION.md
  - .github
  - .build-manifest.json

sass:
  style: compressed
